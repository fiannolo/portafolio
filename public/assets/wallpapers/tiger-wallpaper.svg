<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Base gradient - deep blue -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3a6ea5"/>
      <stop offset="30%" style="stop-color:#2c5a8c"/>
      <stop offset="60%" style="stop-color:#1e4a7a"/>
      <stop offset="100%" style="stop-color:#1a3d68"/>
    </linearGradient>

    <!-- Aqua curve gradients -->
    <linearGradient id="curve1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7ec8e8;stop-opacity:0.6"/>
      <stop offset="50%" style="stop-color:#5ab0d8;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#3a98c8;stop-opacity:0.2"/>
    </linearGradient>

    <linearGradient id="curve2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8ad0f0;stop-opacity:0.5"/>
      <stop offset="50%" style="stop-color:#6ac0e8;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#4aa8d8;stop-opacity:0.15"/>
    </linearGradient>

    <linearGradient id="curve3" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a0e0ff;stop-opacity:0.45"/>
      <stop offset="50%" style="stop-color:#80c8f0;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#60b0e0;stop-opacity:0.1"/>
    </linearGradient>

    <linearGradient id="curve4" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" style="stop-color:#70c0e8;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#90d8f8;stop-opacity:0.25"/>
    </linearGradient>

    <!-- Highlight gradients for glow effect -->
    <radialGradient id="glow1" cx="30%" cy="60%" r="50%">
      <stop offset="0%" style="stop-color:#90d8f8;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#90d8f8;stop-opacity:0"/>
    </radialGradient>

    <radialGradient id="glow2" cx="70%" cy="40%" r="40%">
      <stop offset="0%" style="stop-color:#a8e0ff;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#a8e0ff;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Base background -->
  <rect width="1920" height="1200" fill="url(#bgGrad)"/>

  <!-- Subtle glow effects -->
  <rect width="1920" height="1200" fill="url(#glow1)"/>
  <rect width="1920" height="1200" fill="url(#glow2)"/>

  <!-- Main flowing curves - Aqua style -->

  <!-- Large sweeping curve from bottom-left to top-right -->
  <path
    d="M-200 1400
       Q 400 1000, 800 700
       T 1600 200
       T 2200 -100
       L 2200 1400 Z"
    fill="url(#curve1)"
  />

  <!-- Second curve - crossing from left to right-bottom -->
  <path
    d="M-100 600
       Q 300 400, 700 500
       T 1300 700
       T 1900 500
       T 2100 600
       L 2100 1400
       L -100 1400 Z"
    fill="url(#curve2)"
  />

  <!-- Third curve - top flowing -->
  <path
    d="M-200 200
       Q 200 -50, 600 150
       T 1200 50
       T 1800 200
       T 2100 100
       L 2100 800
       Q 1500 600, 900 750
       T -200 900 Z"
    fill="url(#curve3)"
  />

  <!-- Fourth curve - middle accent -->
  <path
    d="M-100 900
       Q 400 700, 900 850
       T 1500 650
       T 2100 800
       L 2100 1000
       Q 1400 900, 800 1050
       T -100 1100 Z"
    fill="url(#curve4)"
  />

  <!-- Subtle highlight curves -->
  <path
    d="M0 500
       Q 500 350, 1000 450
       T 1920 300"
    fill="none"
    stroke="rgba(180,230,255,0.15)"
    stroke-width="80"
  />

  <path
    d="M-200 800
       Q 400 650, 1000 800
       T 2000 600"
    fill="none"
    stroke="rgba(160,220,255,0.1)"
    stroke-width="100"
  />
</svg>
